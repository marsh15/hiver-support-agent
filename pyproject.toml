[project]
name = "hiver-agent"
version = "0.1.0"
description = "AI support agent for Spotify Cares built on the Customer Support on Twitter dataset"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "openai>=1.40",
    "scikit-learn",
    "pyyaml",
]

[project.optional-dependencies]
kaggle = ["kaggle"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
