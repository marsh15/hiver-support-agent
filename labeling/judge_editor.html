<!DOCTYPE html><html><head><meta charset="utf-8"><title>Judge validation — blind human scoring (50)</title>
<style>body{font-family:-apple-system,Segoe UI,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;background:#fafafa;color:#111}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px 20px;margin:14px 0}

.nav{position:sticky;top:0;background:#fafafa;padding:10px 0;display:flex;gap:12px;align-items:center;z-index:5}
.prog{font-weight:600}
h3{margin:4px 0}</style></head><body>

<div class="nav"><button class="primary" id="dl">Download CSV</button>
<span class="prog" id="prog"></span><span style="color:#666">score 1–5 before forming an opinion of the agent; 5 = exactly what Spotify would say</span></div>

<span><b>actn:</b><button id="actionability_1" data-k="actionability" data-v="1">1</button><button id="actionability_2" data-k="actionability" data-v="2">2</button><button id="actionability_3" data-k="actionability" data-v="3">3</button><button id="actionability_4" data-k="actionability" data-v="4">4</button><button id="actionability_5" data-k="actionability" data-v="5">5</button></span>
<span><b>tone:</b><button id="tone_1" data-k="tone" data-v="1">1</button><button id="tone_2" data-k="tone" data-v="2">2</button><button id="tone_3" data-k="tone" data-v="3">3</button><button id="tone_4" data-k="tone" data-v="4">4</button><button id="tone_5" data-k="tone" data-v="5">5</button></span>
<span><b>safe:</b><button id="safety_1" data-k="safety" data-v="1">1</button><button id="safety_2" data-k="safety" data-v="2">2</button><button id="safety_3" data-k="safety" data-v="3">3</button><button id="safety_4" data-k="safety" data-v="4">4</button><button id="safety_5" data-k="safety" data-v="5">5</button></span></div>
<div class="row"><b>pass:</b>

</div>
<script>
const DATA = [{"id": 1791760, "text": "DM me please. Having issues with your app on Roku.", "reply": "Hi there! We're here to help. Could you tell us your Roku model, OS version, and the Spotify app version? Also, what's the issue or any error messages you're seeing? Feel free to DM us your account username or email so we can look into it further."}, {"id": 2296745, "text": "Spotify Question - i have had an account with spotify for years, it is now through vodafone contract. I want to upgrade this to 'Premium for Family' as a christmas present for my mum! Is this possible? @SpotifyCares", "reply": "Hey! We'd love to help you sort this out. Could you DM us your account's email address or username? We'll check things backstage and see what options you have for upgrading. Let us know if you have any other questions!"}, {"id": 2920775, "text": "Does anyone know why @115888 isn't working?", "reply": "Hey! Sorry to hear you're having trouble. Can you tell us a bit more about what's happening and what device you're using? We'll take a look."}, {"id": 906949, "text": "please have @248108 albums on @115888", "reply": "We\u2019d love to have those albums too! Content availability depends on licensing, but we\u2019re always working to add more. Stay tuned and check here for updates: /SU"}, {"id": 1830830, "text": "Just subscribed for premium. Paid. Still only free account.", "reply": "Hey there! Can you DM us your account's email address or username? We'll check things backstage and help get this sorted for you. For your security, please avoid sharing any private info here. /MA"}, {"id": 2082385, "text": "Help. Being a moron I've forgot what my password is so I can't reset it and I don't seem to be getting the recovery email.", "reply": "No worries, we\u2019re here to help! Could you send us a DM with your account\u2019s email address or username? We\u2019ll check things out under the hood and see what\u2019s going on."}, {"id": 2291872, "text": "really cares for us, thank you for making my days better with music!\nPremium for 2 years \ud83d\udc96", "reply": "That's music to our ears! Thanks for the love and for being with us for 2 years \ud83d\udc9a If you ever need anything, just give us a shout. Keep enjoying the tunes! \ud83c\udfb6"}, {"id": 1996910, "text": "I really love how @115888 actually responds to the artists who have music on their platform in a timely manner. Now, if only i knew where to send a pitch to be included on their playlists \ud83e\udd14 https://t.co/c9bqrNsBGR", "reply": "Thanks for your kind words! Playlist inclusion is handled by our Curation team, and there's no formal submission process. We appreciate your interest\u2014feel free to share more about your music or genre so we can guide you further."}, {"id": 2022081, "text": "please put travelin soldier back on it\u2019s a staple of my home album", "reply": "Hey! We\u2019d love to have all of their music available, and we know how important this song is to you. Content can depend on licensing, but you can find more info here: We\u2019re always working to add more! /PB"}, {"id": 1933173, "text": "i deleted my Facebook account. i cannot log into my Spotify account and i can't reset the password. can you help me log in?", "reply": "Sorry to hear you're having trouble! Could you send us a DM with your account's email address or username? We'll take a closer look and help you get back in."}, {"id": 189747, "text": "r u guys okay https://t.co/maSPXok9Ms", "reply": "Hey! We're here and ready to help. Can you tell us a bit more about what's going on?"}, {"id": 2733048, "text": "I have problem with student premium. SheerID accepted my student id , I've checked on my card and the money was sent to you but the premium doesn't work. I log out and in many times, I've checked my good account and it still doesn't work. Can you help me?", "reply": "Hey there! Can you DM us your account's email address or username? We'll check things out backstage and help get this sorted for you."}, {"id": 1803757, "text": ".@SpotifyCares my acct was hacked + acct email changed so I am currently locked out- top notch security over there! Please get in touch!", "reply": "Hey! We're here to help. Could you send us a DM with your account's email or username? If you received any suspicious emails, a screenshot would be helpful too. We'll check things out under the hood. For more info, see our help page:"}, {"id": 1498717, "text": "Hey @SpotifyCares do you respond to messages or just not bother?", "reply": "Hey! Sorry if we've missed your message. Could you share a few more details about what's going on? We're here to help."}, {"id": 1588992, "text": "+ iPhone X = the app is not updated and can\u2019t use the interface on my car now #Frustrating maybe it\u2019s time 2 switch to Apple Music?", "reply": "Hey! We hear your frustration. Could you share your iPhone model, iOS version, and Spotify app version? Also, let us know more about the car interface issue or any error messages. We\u2019ll do our best to help!"}, {"id": 2751164, "text": "Hey. Someone\u2019s changed the email address associated with my account to one I absolutely don\u2019t recognise. Help!", "reply": "Hey! That sounds worrying. Could you DM us your account's email or username? If you have a screenshot of any suspicious email, please include it. We'll check things out backstage. For more help, see our security tips:"}, {"id": 1500875, "text": "In case you were wondering if my Spotify discover got better: this week features Everytime We Touch, Jacob Sartorius, and off-brand Kidz Bop", "reply": "Thanks for sharing your Discover Weekly experience! It's based on what you, and others like you, are listening to. Hopefully next week\u2019s picks are more your style. Let us know if you have any other feedback!"}, {"id": 1198644, "text": "So someone got into my @115888 account. Really I\u2019m only mad they were listening to crappy music.", "reply": "Oh no, that's not what we like to hear! Could you DM us your account's email or username? If you got any odd emails, a screenshot helps too. We'll check things out under the hood. For tips, see our help page: /Team"}, {"id": 1793468, "text": "I've been a paying customer for 5 years and since I verified my address a member of my family has been kicked out", "reply": "Hey! We\u2019re here to help. Could you DM us your account\u2019s email address or username, plus details about the affected family member? We\u2019ll check things out backstage. For your security, please avoid sharing personal info in public tweets."}, {"id": 2412666, "text": "Okay how in the world do I make my playlist so my husband can add to it? We used to be able to do so.\nI clicked \u201cmake collaborative\u201d and shared it with him in a text. He can see the playlist and play songs from it but it won\u2019t allow him to add anything to it.", "reply": "Thanks for reaching out! If your husband can see and play the playlist but can't add songs, double-check that the playlist is set to 'Collaborative' and that he's logged into his Spotify account. Let us know if it still doesn't work!"}, {"id": 654600, "text": "How did Fleet foxes get on #Blues radio in @115888??", "reply": "Hey! Thanks for reaching out and sharing your thoughts. We\u2019re always looking to improve our radio playlists. Could you let us know your favorite blues artists or songs? We\u2019ll pass your feedback on to our team! /JM"}, {"id": 1308336, "text": "@2602 @17940 @32023 @71554 @171772 @77574 @19948 \nHere\u2019s a playlist for you\u2026 Streaming Party of Lit Music by Curtis Pomeroy\nhttps://t.co/brMJvqJwHH", "reply": "Thanks for sharing your playlist and spreading the good vibes! \ud83c\udfb6 We love seeing the community come together over music. If you ever need a hand or have more feedback, just give us a shout. Keep the tunes rolling! \ud83d\udc9a"}, {"id": 1585730, "text": "My song on Spotify seems to have a few audible glitches, and it only happens on @115888 https://t.co/3jKDyLrMp7", "reply": "Hey! Sorry to hear about the glitches. Could you let us know what device and Spotify app version you're using? Also, does this happen with other songs or just this one? Any extra details or screenshots help us dig deeper!"}, {"id": 1927603, "text": "needs an explicit songs filter (for children)! Other players have it. Oh and Apple TV app would be awesome in our house.", "reply": "Thanks for sharing your ideas! We appreciate your feedback on both the explicit filter and Apple TV app. You can show support for these features in our Community. Let us know if you have favorite artists or genres\u2014we love hearing more!"}, {"id": 1558263, "text": "Thank you, @SpotifyCares for hearing a request from all the fans \u2764\ufe0f https://t.co/bjMdULIZ8Q", "reply": "It's music to our ears to hear this! Thanks for sharing your love\u2014your feedback means a lot to us. If you ever need anything else, just give us a shout. \ud83c\udfb6"}, {"id": 826518, "text": "Activated a Family account this morning (__email__) - 3 members invited, 1 OK, the other not receiving the invitation.", "reply": "Hey there! Thanks for reaching out. Could you DM us your account email or username, plus the details for the member not receiving the invite? We'll check things out backstage. For your security, please delete any public tweets with private info. /Team"}, {"id": 2805320, "text": "i can't access my account even though i know i already input my username &amp; password", "reply": "Hey! Sorry to hear you're having trouble accessing your account. Could you send us your account email or username via DM? We'll check things out backstage and help you get back in. /Team"}, {"id": 145912, "text": "Ok but when can we get access to the BTS x Desiigner version on @118721 @115888 ??? #MicDropRemix", "reply": "We know how much you want to listen to the BTS x Desiigner version! Content availability depends on licensing, but we're always working to add more. Let us know your country and we'll check. More info here:"}, {"id": 1592175, "text": "my friend just signed up and we learned that usernames are now system generated only, she has a 25 random character username", "reply": "Hey! Usernames are now system generated, but if your friend has any concerns, could you DM us her account email or username? We'll be happy to check things out backstage for her. Let us know how we can help!"}, {"id": 2707009, "text": "Hey there, did you receive my DM? I really do need your help! \ud83d\udc40 thanks!!!", "reply": "Hi! We've just replied to your DM. Please check your messages and we'll help you out there \ud83d\ude0a"}, {"id": 1308119, "text": "Spotify needs to update at 11 not 12. @115888 @SpotifyCares", "reply": "Hey! We want to help out. Could you let us know what device and Spotify version you're using, and describe the issue a bit more? If you can DM us your account info, we\u2019ll take a closer look. Thanks for reaching out!"}, {"id": 1756649, "text": "Someone hacked my @115888 account, and now all my playlists are gone @SpotifyCares", "reply": "Hey there! That sounds frustrating. Can you DM us your account's email address or username? We'll check things out backstage. If you have any suspicious emails or screenshots, please include those too. We're here to help!"}, {"id": 1580650, "text": "hopefully you can help me figure out my problem with logging in", "reply": "Hey! Help's here. Could you send us a DM with your account email or username? We'll check things out backstage and get you sorted!"}, {"id": 2795551, "text": "hi can you reply to my DM please?", "reply": "Hi there! We've just replied to your DM. Let's continue the conversation there \ud83d\ude0a /Team"}, {"id": 1538897, "text": "when is your iPhone app going to be updated for the iPhone X", "reply": "Hey! Thanks for your interest in iPhone X support. Our team is always working to improve the app. We don't have updates to share right now, but your feedback is appreciated! Stay tuned for news."}, {"id": 1545286, "text": "Y'all need to work on ad targeting. I'm in MI and a few weeks ago got a Verizon add for NY and just got a CA Dunkin Donuts ad", "reply": "Thanks for sharing your experience! We appreciate your feedback on ad targeting and will pass it along to the right team. If you have any more details or suggestions, feel free to let us know!"}, {"id": 1855462, "text": "your iOS app has been frozen for huge chunks of time since the update. It\u2019s almost impossible to use.", "reply": "Hey! That sounds super frustrating. Could you tell us your iOS version and Spotify app version? If you haven't already, try logging out, restarting your device, and logging back in. Let us know if that helps!"}, {"id": 686630, "text": "how can I remove my student status? Unable to update payment details because my student status isn't verified (not a student)", "reply": "Hey there! Can you DM us your account's email address or username? We'll take a look backstage and help you out. Thanks for reaching out!"}, {"id": 2872017, "text": "any plans to launch the official @115888 app in Egypt", "reply": "Hey! We're always working to bring Spotify to more countries. Can you let us know which device you're using? In the meantime, you can sign up for updates about launches in your area here:"}, {"id": 1955898, "text": "Spotify Premium plays on-demand, everywhere. Plus you can skip unlimited. Get moving. https://t.co/XeIFIMvgEx", "reply": "That's music to our ears! \ud83c\udfb6 Thanks for sharing the love. We'll pass your feedback to the team. If you ever need a hand or have more to share, just let us know!"}, {"id": 1897281, "text": ".@115888 @SpotifyCares https://t.co/yVR5NvnsGb 13 pages of comments spanning 2 years and still no action. I guess it's off to @133716", "reply": "We hear you! We'd like to help out. Could you share more details about what's happening? We'll do our best to look into this for you. /TeamSpotify"}, {"id": 2059017, "text": "Hey I've tried to update my payment and continue my premium subscription but every single card I use doesn't work at all. https://t.co/UuATUWUqg5", "reply": "Hey! No worries, we're here to help. Could you DM us your account's email address or username? We'll check things out backstage and get this sorted for you /Team"}, {"id": 40665, "text": "I am one happy camper! Thanks for your help, you guys are awesome! \ud83d\udc4d\ud83c\udffb\ud83d\udc4d\ud83c\udffb\ud83d\udc4d\ud83c\udffb", "reply": "Thanks for the love! We're thrilled to hear you're happy. We'll pass your kind words to the team. If you ever need anything else, just let us know! \ud83d\ude0a"}, {"id": 525713, "text": "@SpotifyCares You guys are charging me for a phantom account, make it stop!", "reply": "Hey there! That doesn't sound right. Could you DM us your account email address or username? We'll take a look backstage and help sort this out privately."}, {"id": 1867352, "text": "disgusting customer services. Charged me twice for 2 mths then after cancelling still took another payment. Now refusing to refund", "reply": "Hey there! We want to help sort this out. Could you send us a DM with your account's email address or username? We'll take a look backstage and continue helping you privately."}, {"id": 1931908, "text": "hi there- I am trying to reset my password but it keeps saying that the \u201cCSRF token is invalid\u201d. What does that mean?", "reply": "Hey there! Sorry you're running into this. Could you DM us your account's email address or username? We'll check things out backstage and help sort this out for you."}, {"id": 1905042, "text": "Hey, so I was recently logged out of my account on my laptop and I've forgotten my password but everytime I put my user into+", "reply": "Hey, help's here! Could you DM us your email address or username? We'll check things out backstage and get you back on track."}, {"id": 568925, "text": "Hey @SpotifyCares I have a small issue. Mind lending a hand ?", "reply": "Hi there! We're here to help. Can you tell us a bit more about the issue you're having? We'll do our best to assist /RB"}, {"id": 1962487, "text": "Quit Billing me I do not have an account with you. How do I stop this?", "reply": "Hey there, that doesn't sound right! Can you DM us any email addresses or usernames you might've used? We'll check things out backstage and help sort this privately."}, {"id": 2032691, "text": "@3493 @125633 this is crazy thank you!! Desire on Spotify &amp; Chill \u270c\ufe0f\n https://t.co/2saHILgWYy", "reply": "Hey there! Thanks for sharing the love \u2013 it's music to our ears \ud83c\udfb6 We'll pass your feedback to the team. If you ever need anything else, just let us know! \ud83d\udc9a"}];
const KEY = "judge_gate";
const COLS = ["id", "groundedness", "actionability", "tone", "safety", "human_pass"];
const OUT = "judge_sheet_filled.csv";
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
let i = parseInt(localStorage.getItem(KEY + "_i") || "0");
function save(){localStorage.setItem(KEY, JSON.stringify(state));localStorage.setItem(KEY+"_i", i);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function complete(s){ return ['groundedness','actionability','tone','safety','human_pass'].every(k => s[k] !== undefined); }
function dl(){
  const rows = DATA.map(r => Object.assign({}, r, state[r.id] || {}));
  const csv = [COLS.join(",")].concat(rows.map(r => COLS.map(c => {
    let v = r[c] === undefined ? "" : r[c]; v = String(v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  }).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = OUT; a.click();
}
document.getElementById("dl").onclick = dl;
function upd(k, v){
  const r = DATA[i];
  state[r.id] = state[r.id] || {};
  state[r.id][k] = v;
  state[r.id].__complete__ = complete(state[r.id]);
  save();
  if(state[r.id].__complete__) setTimeout(()=>{ i = Math.min(i+1, DATA.length); save(); render(); }, 150);
  render();
}
document.querySelectorAll("button[data-k]").forEach(b =>
  b.addEventListener("click", () => upd(b.dataset.k, b.dataset.v)));
const sel = document.getElementById("intent_sel");
if (sel) sel.addEventListener("change", () => upd("intent", sel.value));
document.getElementById("prev").onclick = () => { i = Math.max(0, i-1); save(); render(); };
document.getElementById("next").onclick = () => { i = Math.min(DATA.length-1, i+1); save(); render(); };

function render(){
  const done = DATA.filter(r => state[r.id] && state[r.id].__complete__).length;
  document.getElementById("prog").textContent = done + " / " + DATA.length + " done";
  const r = DATA[i];
  if(!r){ document.getElementById("card").innerHTML = "<h2>All done — click Download CSV.</h2>"; return; }
  const s = state[r.id] || {};
  document.getElementById("tweet").textContent = r.text;
  document.getElementById("reply").textContent = r.reply;
  ["groundedness","actionability","tone","safety"].forEach(d =>
    [1,2,3,4,5].forEach(n => {
      const b = document.getElementById(d + "_" + n);
      b.className = s[d] === String(n) ? "on" : "";
    }));
  document.getElementById("pass_true").className = s.human_pass === "true" ? "on" : "";
  document.getElementById("pass_false").className = s.human_pass === "false" ? "on" : "";
}

</script></body></html>
