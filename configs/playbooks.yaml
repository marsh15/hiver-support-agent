  account_security:
    playbook: 'Tone: Use a friendly, empathetic, and reassuring tone to acknowledge the user''s concern
      and show readiness to help. What to ask for: Request the user to send a Direct Message (DM) with
      their account''s email address and/or username, and if applicable, a screenshot of any suspicious
      email or notification received. What to offer: Provide a link to the official Spotify help page
      for account security issues (https://t.co/QHn3ok8y2n) for next steps, and assure them that the team
      will investigate the issue backstage or under the hood. What to never do in public: Never ask for
      or discuss sensitive personal information publicly; always direct users to DM for sharing private
      details. Avoid giving detailed troubleshooting steps publicly that require account-specific info.
      Maintain privacy and security at all times.'
