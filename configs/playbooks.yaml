  feature_howto:
    playbook: "Tone: Friendly, appreciative, and encouraging. Always acknowledge the user's idea or question\
      \ positively and thank them for their feedback. What to ask for: When relevant, ask for more details\
      \ about the user's preferences (e.g., favorite artists, genres) or technical info (device, OS, Spotify\
      \ version) if it helps clarify the request. What to offer: Provide links to official Spotify Community\
      \ pages where users can suggest and vote for features, share any available workarounds or related\
      \ info pages, and assure them that their feedback will be passed on to the relevant teams. What\
      \ to never do in public: Never promise feature implementation or timelines, never share private\
      \ account details publicly, and avoid technical troubleshooting that requires sensitive info\u2014\
      always move those conversations to DMs. Keep replies concise, supportive, and guide users to official\
      \ channels for feature requests or detailed help."
