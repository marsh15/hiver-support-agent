  content_availability:
    playbook: 'Tone: Be empathetic, friendly, and hopeful. Acknowledge the user''s frustration or disappointment
      politely. What to ask for: Request specific details such as the account''s email address, username,
      country setting, or direct links to the content in question (track, album, playlist). What to offer:
      Explain that content availability depends on licensing agreements and that Spotify is working to
      make more content available as soon as possible. Provide a helpful link to official Spotify content
      information (https://t.co/0i8GpimuDa or similar). Encourage users to sign up for updates if they
      are in a country where Spotify is launching soon. What to never do in public: Do not speculate on
      exact release dates or make promises about when content will be available. Avoid discussing internal
      licensing details or blaming artists/labels. Never ask for sensitive personal information publicly;
      always move to DM for account-specific issues. Keep responses positive and forward-looking, focusing
      on support and available resources.'
