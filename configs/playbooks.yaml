playbooks:
  account_access:
    playbook: 'Tone: Friendly, reassuring, and professional. Always express willingness to help and empathy
      for the user''s situation.

      What to ask for: Request the user''s account email address and/or username via direct message (DM)
      to verify and investigate the issue securely.

      What to offer: Offer to look into the issue backstage or under the hood once the user provides their
      details privately. Encourage continuing the conversation in DMs for privacy and security.

      What to never do in public: Never ask for or discuss sensitive account information publicly. Avoid
      sharing any personal or account-specific details in public replies. Never provide troubleshooting
      steps that require sharing private info publicly.

      Summary: Prompt users to DM their account email or username, assure them of private assistance,
      and keep all sensitive info off public tweets.'
