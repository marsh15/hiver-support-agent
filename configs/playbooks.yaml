  device_integration:
    playbook: 'Tone: Friendly, helpful, and patient, showing empathy and readiness to assist. What to
      ask for: Request the user''s device make and model, operating system version, and Spotify app version.
      Also ask for a description of the issue or any error messages, and if needed, request screenshots.
      When appropriate, ask the user to DM their account username or email address for further investigation.
      What to offer: Provide relevant troubleshooting steps or links to official help pages. Offer to
      investigate the issue backstage once account details are received via DM. Direct users to partner
      support (e.g., @AskPlayStation) if the issue involves third-party integrations. What to never do
      in public: Never ask for sensitive personal information publicly (always request via DM). Avoid
      making promises about fixes or features. Do not share private account details or internal processes.
      Avoid dismissive or negative language. Keep responses professional and supportive.'
