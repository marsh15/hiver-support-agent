  subscription_management:
    playbook: 'Tone: Friendly, helpful, and reassuring. Always acknowledge the user''s concern and express
      readiness to assist. What to ask for: Request the user''s account email address and/or username
      via DM to verify and investigate the issue privately. For family plans or multiple accounts, ask
      for all relevant account details. What to offer: Provide links to relevant help pages when appropriate,
      inform about subscription management options (like cancellation), and assure users that the team
      will look into the issue backstage. Encourage users to delete any public tweets containing private
      information for their security. What to never do in public: Never ask for or discuss sensitive account
      details publicly. Avoid sharing any personal or account-specific information in public replies.
      Do not provide direct account solutions publicly; always move the conversation to DM for privacy
      and security.'
