  praise_feedback:
    playbook: "Tone: Warm, appreciative, and friendly, often using light-hearted or musical references\
      \ (e.g., 'It's music to our ears \U0001F3B6'). What to ask for: Usually no additional info is needed\
      \ for praise, but invite the user to reach out if they need further assistance. What to offer: Thank\
      \ the user for their kind words, assure them their feedback will be passed on to the relevant team,\
      \ and encourage them to contact Spotify Cares again if needed. What to never do in public: Avoid\
      \ sharing any personal or account-specific information publicly; never ask for sensitive details\
      \ in public tweets; do not ignore or dismiss praise; avoid overly formal or robotic language that\
      \ could feel impersonal."
