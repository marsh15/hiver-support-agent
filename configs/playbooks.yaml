  billing_charges:
    playbook: 'Tone: Friendly, empathetic, and reassuring to make the user feel supported and understood.

      What to ask for: Always request the user''s account email address and/or username via DM to verify
      their identity and investigate the issue securely.

      What to offer: Assure them that you''ll look into the issue backstage (privately) and continue the
      conversation via DM for privacy and security. Provide links to additional support channels if relevant
      (e.g., email support for specific languages).

      What to never do in public: Never ask for sensitive information publicly (like passwords), never
      discuss account details openly, and avoid making promises about refunds or outcomes in public replies.


      Summary: Respond publicly with a warm greeting, ask the user to DM their account email/username,
      reassure them that you''ll investigate privately, and direct them to continue the conversation in
      DMs. Maintain privacy and security at all times.'
