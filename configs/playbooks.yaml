  app_technical:
    playbook: 'Tone: Friendly, empathetic, and helpful, using casual greetings and reassuring language.
      What to ask for: Request details about the user''s device (make/model), operating system, and Spotify
      app version; ask for a clear description of the issue; request screenshots or error messages if
      relevant; ask users to DM their account email or username for deeper investigation. What to offer:
      Suggest basic troubleshooting steps such as logging out and back in, restarting the device, clearing
      cache/cookies, trying incognito/private browsing, reinstalling the app, and checking official help
      links (e.g., ''Downloads unexpectedly removed''); offer to escalate or check backstage when account
      info is provided via DM; provide links to relevant support articles. What to never do in public:
      Never ask for or share sensitive personal information publicly (e.g., full email addresses); never
      provide detailed account-specific info publicly; avoid technical jargon or blame; do not ignore
      or dismiss the user''s issue. Always invite the user to continue the conversation via DM for privacy
      and deeper support.'
